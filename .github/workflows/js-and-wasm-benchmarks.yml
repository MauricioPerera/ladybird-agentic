name: 'JS benchmarks'

on:
  workflow_run:
    workflows: ['Package the js repl as a binary artifact']
    branches: [master]
    types: [completed]

env:
  JS_BENCHMARKS_COMMIT: 1c2ebe95ccc8da2c72b2a3d9c2234615ceb68cd6

jobs:
  prepare_linux_metadata:
    name: 'Read Linux package metadata'
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'LadybirdBrowser/ladybird' && github.event.workflow_run.conclusion == 'success' }}

    permissions:
      actions: read

    outputs:
      build_commit: ${{ steps.js-build-commit.outputs.sha }}

    steps:
      # The package commit can differ from workflow_run.head_sha for a manual build of an older reference. Read the
      # corresponding package's COMMIT marker on a hosted worker without webhook secrets or benchmark code.
      - name: 'Download Linux JS repl metadata source'
        uses: actions/download-artifact@v8
        with:
          name: ladybird-js-Linux-x86_64
          path: js-repl-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 'Validate Linux JS repl build commit'
        id: js-build-commit
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          archive=js-repl-metadata/ladybird-js-Linux-x86_64.tar.gz
          commit_entries=$(tar -tzf "${archive}" | awk '$0 == "COMMIT" { count++ } END { print count + 0 }')
          if [[ "${commit_entries}" -ne 1 ]]; then
            echo "expected exactly one COMMIT entry in the Linux package, found ${commit_entries}" >&2
            exit 1
          fi
          commit_hash=$(tar -xOzf "${archive}" COMMIT)
          if [[ ! "${commit_hash}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Linux JS repl COMMIT is not a full commit hash' >&2
            exit 1
          fi
          if [[ "${TRIGGER_EVENT}" == 'push' ]]; then
            if [[ ! "${TRIGGER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${commit_hash}" != "${TRIGGER_HEAD_SHA}" ]]; then
              echo 'Linux JS repl COMMIT does not match the triggering push' >&2
              exit 1
            fi
          elif [[ "${TRIGGER_EVENT}" != 'workflow_dispatch' ]]; then
            echo "unexpected packaging trigger ${TRIGGER_EVENT}" >&2
            exit 1
          fi
          echo "sha=${commit_hash}" >> "${GITHUB_OUTPUT}"

  prepare_macos_metadata:
    name: 'Read macOS package metadata'
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'LadybirdBrowser/ladybird' && github.event.workflow_run.conclusion == 'success' }}

    permissions:
      actions: read

    outputs:
      build_commit: ${{ steps.js-build-commit.outputs.sha }}

    steps:
      - name: 'Download macOS JS repl metadata source'
        uses: actions/download-artifact@v8
        with:
          name: ladybird-js-macOS-arm64
          path: js-repl-metadata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 'Validate macOS JS repl build commit'
        id: js-build-commit
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          archive=js-repl-metadata/ladybird-js-macOS-arm64.tar.gz
          commit_entries=$(tar -tzf "${archive}" | awk '$0 == "COMMIT" { count++ } END { print count + 0 }')
          if [[ "${commit_entries}" -ne 1 ]]; then
            echo "expected exactly one COMMIT entry in the macOS package, found ${commit_entries}" >&2
            exit 1
          fi
          commit_hash=$(tar -xOzf "${archive}" COMMIT)
          if [[ ! "${commit_hash}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'macOS JS repl COMMIT is not a full commit hash' >&2
            exit 1
          fi
          if [[ "${TRIGGER_EVENT}" == 'push' ]]; then
            if [[ ! "${TRIGGER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${commit_hash}" != "${TRIGGER_HEAD_SHA}" ]]; then
              echo 'macOS JS repl COMMIT does not match the triggering push' >&2
              exit 1
            fi
          elif [[ "${TRIGGER_EVENT}" != 'workflow_dispatch' ]]; then
            echo "unexpected packaging trigger ${TRIGGER_EVENT}" >&2
            exit 1
          fi
          echo "sha=${commit_hash}" >> "${GITHUB_OUTPUT}"

  js-benchmarks:
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    if: ${{ github.repository == 'LadybirdBrowser/ladybird' && github.event.workflow_run.conclusion == 'success' }}
    name: ${{ matrix.os_name }}, ${{ matrix.arch }}
    container: ${{ fromJSON(matrix.container) }}

    strategy:
      fail-fast: false
      matrix:
        os_name: ['Linux']
        arch: ['x86_64']
        package_type: ['Linux-x86_64']
        runner_labels: ['["ubuntu-24.04-internal", "js-benchmarks", "self-hosted"]']
        container: ['{"image":"ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21"}']

        include:
          - os_name: 'macOS'
            arch: 'arm64'
            package_type: 'macOS-arm64'
            runner_labels: '["macos-26", "js-benchmarks", "self-hosted"]'
            container: 'null'

    permissions:
      actions: read
      contents: read

    steps:
      - name: 'Checkout LadybirdBrowser/js-benchmarks'
        uses: actions/checkout@v7.0.1
        with:
          repository: LadybirdBrowser/js-benchmarks
          path: js-benchmarks
          ref: ${{ env.JS_BENCHMARKS_COMMIT }}
          persist-credentials: false

      - name: 'Download JS repl artifact'
        uses: dawidd6/action-download-artifact@v24
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: ladybird-js-${{ matrix.package_type }}
          path: js-repl

      - name: 'Extract JS repl'
        shell: bash
        run: |
          cd js-repl
          tar -xvzf ladybird-js-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

      - name: 'Download wasm repl artifact'
        uses: dawidd6/action-download-artifact@v24
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: ladybird-wasm-${{ matrix.package_type }}
          path: wasm-repl
          if_no_artifact_found: warn

      - name: 'Extract wasm repl'
        if: ${{ hashFiles('wasm-repl/*.tar.gz') != '' }}
        shell: bash
        run: |
          cd wasm-repl
          tar -xvzf ladybird-wasm-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

      - name: 'Run the benchmarks'
        shell: bash
        run: |
          cd js-benchmarks
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install -r requirements.txt

          run_options='--iterations=3'

          js_path="${GITHUB_WORKSPACE}/js-repl/bin/js"
          run_options="${run_options} --executable=${js_path}"

          wasm_path="${GITHUB_WORKSPACE}/wasm-repl/bin/wasm"
          if [ -x "${wasm_path}" ]; then
              run_options="${run_options} --wasm-executable=${wasm_path}"
          else
              echo "Wasm repl not found; skipping wasm benchmarks."
          fi

          if [ "${{ github.event.workflow_run.event }}" = "workflow_dispatch" ]; then
              # Upstream was run manually; we might run into failing benchmarks as a result of older builds.
              run_options="${run_options} --continue-on-failure"
          fi

          ./run.py ${run_options}

      - name: 'Save results as an artifact'
        uses: actions/upload-artifact@v7
        with:
          name: js-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
          path: js-benchmarks/results.json
          retention-days: 90

  notify:
    name: 'Notify for ${{ matrix.os_name }}, ${{ matrix.arch }}'
    needs: [prepare_linux_metadata, prepare_macos_metadata, js-benchmarks]
    if: ${{ always() && !cancelled() && github.repository == 'LadybirdBrowser/ladybird' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        os_name: ['Linux', 'macOS']
        arch: ['x86_64', 'arm64']
        exclude:
          - os_name: 'Linux'
            arch: 'arm64'
          - os_name: 'macOS'
            arch: 'x86_64'

    permissions:
      actions: read

    steps:
      # A failed or missing package only fails its matching notifier matrix job. The sibling still validates and sends
      # independently because this matrix has fail-fast disabled.
      - name: 'Require trusted platform metadata'
        shell: bash
        env:
          OS_NAME: ${{ matrix.os_name }}
          LINUX_METADATA_JOB_RESULT: ${{ needs.prepare_linux_metadata.result }}
          LINUX_COMMIT: ${{ needs.prepare_linux_metadata.outputs.build_commit }}
          MACOS_METADATA_JOB_RESULT: ${{ needs.prepare_macos_metadata.result }}
          MACOS_COMMIT: ${{ needs.prepare_macos_metadata.outputs.build_commit }}
        run: |
          set -euo pipefail
          if [[ "${OS_NAME}" == 'Linux' ]]; then
            metadata_job_result=${LINUX_METADATA_JOB_RESULT}
            commit=${LINUX_COMMIT}
          elif [[ "${OS_NAME}" == 'macOS' ]]; then
            metadata_job_result=${MACOS_METADATA_JOB_RESULT}
            commit=${MACOS_COMMIT}
          else
            echo "unexpected benchmark platform ${OS_NAME}" >&2
            exit 1
          fi
          if [[ "${metadata_job_result}" != 'success' || ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'trusted build metadata is unavailable for this platform' >&2
            exit 1
          fi
          echo "TRUSTED_BUILD_COMMIT=${commit}" >> "${GITHUB_ENV}"

      # The artifact body is not downloaded or interpreted here. Its exact, workflow-defined name is only a completion
      # signal, preserving per-platform notifications when another matrix entry fails.
      - name: 'Require benchmark results artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: js-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          artifact_api_url=$(python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          base_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          parsed = urlsplit(base_url)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password
                  or parsed.query or parsed.fragment):
              raise SystemExit("GITHUB_API_URL is not an HTTPS API base URL")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("GITHUB_REPOSITORY is invalid")
          if not run_id.isascii() or not run_id.isdigit():
              raise SystemExit("GITHUB_RUN_ID is not numeric")
          print(f"{base_url}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
          PY
          )
          http_status=$(curl --fail --silent --show-error \
              --proto '=https' \
              --max-redirs 0 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output artifacts.json \
              --write-out '%{http_code}' \
              "${artifact_api_url}")
          if [[ "${http_status}" != '200' ]]; then
            echo "artifact list request returned HTTP ${http_status}" >&2
            exit 1
          fi
          python3 - "${ARTIFACT_NAME}" <<'PY'
          import json
          import sys

          expected_name = sys.argv[1]
          with open("artifacts.json", encoding="utf-8") as artifacts_file:
              artifacts = json.load(artifacts_file).get("artifacts", [])
          matches = [artifact for artifact in artifacts
                     if artifact.get("name") == expected_name and artifact.get("expired") is False]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one current {expected_name!r} artifact, found {len(matches)}")
          PY

      - name: 'Create webhook request'
        shell: bash
        env:
          BENCHMARKS_COMMIT: ${{ env.JS_BENCHMARKS_COMMIT }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: js-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          commit = os.environ["TRUSTED_BUILD_COMMIT"]
          benchmarks_commit = os.environ["BENCHMARKS_COMMIT"]
          os_name = os.environ["OS_NAME"]
          arch = os.environ["ARCH"]
          artifact = os.environ["ARTIFACT_NAME"]
          artifact_run_id = os.environ["ARTIFACT_RUN_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("commit is not a full commit hash")
          if not re.fullmatch(r"[0-9a-f]{40}", benchmarks_commit):
              raise SystemExit("benchmarks_commit is not a full commit hash")
          if (os_name, arch) not in {("Linux", "x86_64"), ("macOS", "arm64")}:
              raise SystemExit("unexpected benchmark platform")
          if artifact != f"js-benchmarks-results-{os_name}-{arch}":
              raise SystemExit("unexpected artifact name")
          if not artifact_run_id.isascii() or not artifact_run_id.isdigit():
              raise SystemExit("artifact_run_id is not numeric")
          request = {
              "commit": commit,
              "benchmarks_commit": benchmarks_commit,
              "os": os_name,
              "arch": arch,
              "artifact": artifact,
              "artifact_run_id": artifact_run_id,
          }
          with open("request.json", "w", encoding="utf-8") as request_file:
              json.dump(request, request_file, separators=(",", ":"))
              request_file.write("\n")
          PY

      - name: 'Call webhook'
        shell: bash
        env:
          WEBHOOK_SECRET: ${{ secrets.JS_BENCHMARKS_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.JS_BENCHMARKS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          signature=$(openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" request.json | cut -d' ' -f2)
          http_status=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-redirs 0 \
              --header 'Content-Type: application/json' \
              --header "X-Hub-Signature-256: sha256=${signature}" \
              --data-binary '@request.json' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${WEBHOOK_URL}")
          if [[ ! "${http_status}" =~ ^2[0-9]{2}$ ]]; then
            echo "webhook returned HTTP ${http_status}" >&2
            exit 1
          fi
