name: 'Web benchmarks'

on:
  push:
    branches: [master]

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  WEB_BENCHMARKS_COMMIT: 5f19304e266aef1c02def310d17770823e6dee10

jobs:
  web-benchmarks:
    # A run takes longer on each runner than master usually goes between pushes, and the runners are the ones that the
    # PR benchmark runs (bench-pr.yml) queue for. So only the newest push waits for each platform's runner: A push
    # replaces the job still waiting for the previous one, and lets the job in progress finish. Each platform has a
    # group of its own, so neither waits for the other's runner.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os_name }}-${{ matrix.arch }}
      cancel-in-progress: false
    # A run takes a quarter of an hour, and half an hour at the most. A job that hangs holds its platform's runner, and
    # each push meanwhile replaces the job waiting behind it, so the history skips every push until the job ends.
    timeout-minutes: 60
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    if: ${{ github.repository == 'LadybirdBrowser/ladybird' }}
    name: ${{ matrix.os_name }}, ${{ matrix.arch }}
    container: ${{ fromJSON(matrix.container) }}

    strategy:
      fail-fast: false
      matrix:
        os_name: ['Linux']
        arch: ['x86_64']
        runner_labels: ['["ubuntu-24.04-internal", "web-benchmarks", "self-hosted"]']
        container: ['{"image":"ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21"}']

        include:
          - os_name: 'macOS'
            arch: 'arm64'
            runner_labels: '["macos-26", "web-benchmarks", "self-hosted"]'
            container: 'null'

    permissions:
      actions: read
      contents: read

    steps:
      - name: 'Checkout ladybird'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 'Checkout LadybirdBrowser/web-benchmarks'
        uses: actions/checkout@v7.0.1
        with:
          repository: LadybirdBrowser/web-benchmarks
          path: web-benchmarks
          ref: ${{ env.WEB_BENCHMARKS_COMMIT }}
          persist-credentials: false

      - name: 'Set Up Environment'
        id: 'setup'
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os_name }}
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          build_preset: 'Distribution'

      - name: 'Restore Caches'
        uses: ./.github/actions/cache-restore
        id: 'cache-restore'
        with:
          os: ${{ matrix.os_name }}
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          cache_key_extra: 'Distribution'
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          sccache_path: ${{ steps.setup.outputs.sccache_path }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}

      - name: 'Assign Build Parameters'
        id: 'build-parameters'
        shell: bash
        run: |
          if ${{ matrix.os_name == 'Linux' }} ; then
            echo "host_cc=clang" >> "$GITHUB_OUTPUT"
            echo "host_cxx=clang++" >> "$GITHUB_OUTPUT"
          elif ${{ matrix.os_name == 'macOS' }} ; then
            echo "host_cc=$(xcrun --find clang)" >> "$GITHUB_OUTPUT"
            echo "host_cxx=$(xcrun --find clang++)" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Create Build Environment'
        working-directory: ${{ github.workspace }}
        run: |
          cmake --preset Distribution -B Build \
            -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python \
            -DCMAKE_C_COMPILER=${{ steps.build-parameters.outputs.host_cc }} \
            -DCMAKE_CXX_COMPILER=${{ steps.build-parameters.outputs.host_cxx }}

      - name: 'Build'
        working-directory: ${{ github.workspace }}/Build
        run: cmake --build . --target ladybird

      # vcpkg's install log names a port that failed to build, but the port's own logs hold the error.
      - name: 'Collect the logs of vcpkg ports that failed to build'
        if: ${{ failure() }}
        shell: bash
        run: |
          out=vcpkg-failure-logs
          mkdir -p "$out"
          find Build -name vcpkg-manifest-install.log | while read -r install_log; do
            sed -n 's/^error: building \([^:[]*\).*/\1/p' "$install_log" | sort -u | while read -r port; do
              mkdir -p "$out/$port"
              find Build -path "*/buildtrees/$port/*.log" -exec cp {} "$out/$port"/ \; || true
            done
            cp "$install_log" "$out"/
          done || true

      - name: 'Save the logs of vcpkg ports that failed to build'
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-failure-logs-${{ matrix.os_name }}-${{ matrix.arch }}
          path: vcpkg-failure-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: 'Save Caches'
        uses: ./.github/actions/cache-save
        with:
          arch: ${{ matrix.arch }}
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          sccache_path: ${{ steps.setup.outputs.sccache_path }}
          sccache_primary_key: ${{ steps.cache-restore.outputs.sccache_primary_key }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

      - name: 'Run the benchmarks'
        shell: bash
        run: |
          cd web-benchmarks
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install -r requirements.txt

          if [ "${{ matrix.os_name }}" = "macOS" ]; then
            executable="${GITHUB_WORKSPACE}/Build/bin/Ladybird.app/Contents/MacOS/Ladybird"
          else
            executable="${GITHUB_WORKSPACE}/Build/bin/Ladybird"
          fi

          ./run.py --iterations=3 --executable="${executable}"

      - name: 'Save results as an artifact'
        uses: actions/upload-artifact@v7
        with:
          name: web-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
          path: web-benchmarks/results.json
          retention-days: 90

  notify:
    name: 'Notify for ${{ matrix.os_name }}, ${{ matrix.arch }}'
    needs: web-benchmarks
    if: ${{ always() && !cancelled() && github.repository == 'LadybirdBrowser/ladybird' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        os_name: ['Linux', 'macOS']
        arch: ['x86_64', 'arm64']
        exclude:
          - os_name: 'Linux'
            arch: 'arm64'
          - os_name: 'macOS'
            arch: 'x86_64'

    permissions:
      actions: read

    steps:
      # The artifact body is not downloaded or interpreted here. Its exact, workflow-defined name is only a completion
      # signal, preserving per-platform notifications when another matrix entry fails.
      - name: 'Require benchmark results artifact'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: web-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          artifact_api_url=$(python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          base_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          parsed = urlsplit(base_url)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password
                  or parsed.query or parsed.fragment):
              raise SystemExit("GITHUB_API_URL is not an HTTPS API base URL")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("GITHUB_REPOSITORY is invalid")
          if not run_id.isascii() or not run_id.isdigit():
              raise SystemExit("GITHUB_RUN_ID is not numeric")
          print(f"{base_url}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100")
          PY
          )
          http_status=$(curl --fail --silent --show-error \
              --proto '=https' \
              --max-redirs 0 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output artifacts.json \
              --write-out '%{http_code}' \
              "${artifact_api_url}")
          if [[ "${http_status}" != '200' ]]; then
            echo "artifact list request returned HTTP ${http_status}" >&2
            exit 1
          fi
          python3 - "${ARTIFACT_NAME}" <<'PY'
          import json
          import sys

          expected_name = sys.argv[1]
          with open("artifacts.json", encoding="utf-8") as artifacts_file:
              artifacts = json.load(artifacts_file).get("artifacts", [])
          matches = [artifact for artifact in artifacts
                     if artifact.get("name") == expected_name and artifact.get("expired") is False]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one current {expected_name!r} artifact, found {len(matches)}")
          PY

      - name: 'Create webhook request'
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
          BENCHMARKS_COMMIT: ${{ env.WEB_BENCHMARKS_COMMIT }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: web-benchmarks-results-${{ matrix.os_name }}-${{ matrix.arch }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          commit = os.environ["COMMIT"]
          benchmarks_commit = os.environ["BENCHMARKS_COMMIT"]
          os_name = os.environ["OS_NAME"]
          arch = os.environ["ARCH"]
          artifact = os.environ["ARTIFACT_NAME"]
          artifact_run_id = os.environ["ARTIFACT_RUN_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("commit is not a full commit hash")
          if not re.fullmatch(r"[0-9a-f]{40}", benchmarks_commit):
              raise SystemExit("benchmarks_commit is not a full commit hash")
          if (os_name, arch) not in {("Linux", "x86_64"), ("macOS", "arm64")}:
              raise SystemExit("unexpected benchmark platform")
          if artifact != f"web-benchmarks-results-{os_name}-{arch}":
              raise SystemExit("unexpected artifact name")
          if not artifact_run_id.isascii() or not artifact_run_id.isdigit():
              raise SystemExit("artifact_run_id is not numeric")
          request = {
              "commit": commit,
              "benchmarks_commit": benchmarks_commit,
              "os": os_name,
              "arch": arch,
              "artifact": artifact,
              "artifact_run_id": artifact_run_id,
          }
          with open("request.json", "w", encoding="utf-8") as request_file:
              json.dump(request, request_file, separators=(",", ":"))
              request_file.write("\n")
          PY

      - name: 'Call webhook'
        shell: bash
        env:
          WEBHOOK_SECRET: ${{ secrets.JS_BENCHMARKS_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.JS_BENCHMARKS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          signature=$(openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" request.json | cut -d' ' -f2)
          http_status=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-redirs 0 \
              --header 'Content-Type: application/json' \
              --header "X-Hub-Signature-256: sha256=${signature}" \
              --data-binary '@request.json' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${WEBHOOK_URL}")
          if [[ ! "${http_status}" =~ ^2[0-9]{2}$ ]]; then
            echo "webhook returned HTTP ${http_status}" >&2
            exit 1
          fi
