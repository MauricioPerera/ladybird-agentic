<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bash Workbench</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/__ladybird_bridge.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <header class="brand">
          <img src="/icon.svg" alt="Bash Workbench" width="28" height="28" />
          <div>
            <h1>Bash Workbench</h1>
            <p class="subtitle">just-bash · Ladybird App Mode</p>
          </div>
        </header>

        <section class="card" aria-label="Account switcher">
          <div class="card-row">
            <span class="label">Account</span>
            <span class="pill" id="account-pill">default</span>
          </div>
          <div class="account-controls">
            <select id="account-select" aria-label="Accounts"></select>
            <button id="open-account-btn" type="button" class="btn btn-sm">Open</button>
            <button id="new-account-btn" type="button" class="btn btn-sm">+ Add</button>
          </div>
          <div class="muted-line" id="storage-meta">Loading storage...</div>
        </section>

        <section class="presets" aria-label="Quick presets">
          <div class="label">Quick Commands</div>
          <div class="preset-grid">
            <button type="button" class="btn btn-sm preset-btn" data-cmd="ls -la /workspace">ls -la</button>
            <button type="button" class="btn btn-sm preset-btn" data-cmd="cat /workspace/tasks.json | jq '[.[] | select(.done == false) | .title]'">jq pending</button>
            <button type="button" class="btn btn-sm preset-btn" data-cmd="awk -F, 'NR&gt;1 {sum+=$3} END {print &quot;Total:&quot;, sum}' /workspace/sales.csv">awk sales</button>
            <button type="button" class="btn btn-sm preset-btn" data-cmd="kv list | jq">kv list | jq</button>
          </div>
        </section>

        <section class="files-card">
          <div class="card-row">
            <span class="label">/workspace</span>
            <button id="refresh-files-btn" type="button" class="btn btn-sm">Refresh</button>
          </div>
          <ul id="file-list" class="file-list" aria-label="Workspace files"></ul>
        </section>

        <footer class="card" id="runtime-card">
          <div class="badge" id="boot-status" data-state="booting">booting</div>
          <div class="muted-line" id="runtime-meta"></div>
        </footer>
      </aside>

      <main class="main-pane">
        <div class="terminal" id="terminal-log" role="log" aria-live="polite"></div>

        <form id="cmd-form" class="prompt-bar">
          <span class="prompt-glyph">$</span>
          <input
            id="cmd-input"
            type="text"
            placeholder="cat /workspace/tasks.json | jq .   (or ask an agent via WebMCP run_bash)"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="run-btn" type="submit" class="btn btn-primary">Run</button>
        </form>

        <div class="status-bar">
          <span id="sync-status">Synced 0 files</span>
          <span id="webmcp-status">WebMCP: initializing...</span>
        </div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
